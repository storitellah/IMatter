name: Build Android APK

# Builds the offline I Matter Android app (a WebView that bundles the whole
# web app inside the APK). Produces a downloadable, shareable .apk.
#
# How to get the APK:
#   • Manually: Actions tab -> "Build Android APK" -> Run workflow. When it
#     finishes, download the "i-matter-apk" artifact.
#   • On a release: push a tag like v4.2.0 and the APK is attached to the
#     GitHub Release automatically.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to attach the APK to a Release on tag builds

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Bundle the web app into the Android project
        run: bash tools/sync-web-assets.sh

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Stage APK with a friendly name
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/i-matter-${GITHUB_REF_NAME}.apk"
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: i-matter-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach APK to the Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
