<svg xmlns="http://www.w3.org/2000/svg" width="384" height="128" viewBox="0 0 384 128" role="img" aria-label="Imagine Tomorrow logo">
  <rect width="384" height="128" rx="14" fill="#69c6d0"/>
  <g fill="#ffffff" font-family="'Arial Black', 'Arial Bold', Arial, Helvetica, sans-serif" font-weight="900" letter-spacing="1">
    <!-- Line 1: IMAGINE; with IM inside a box -->
    <rect x="14" y="20" width="82" height="54" rx="6" fill="none" stroke="#ffffff" stroke-width="6"/>
    <text x="26" y="61" font-size="46" textLength="58" lengthAdjust="spacingAndGlyphs">IM</text>
    <text x="106" y="61" font-size="46">AGINE;</text>
    <!-- Line 2: TOMORROW -->
    <text x="16" y="114" font-size="44" textLength="352" lengthAdjust="spacingAndGlyphs">TOMORROW</text>
  </g>
</svg>
