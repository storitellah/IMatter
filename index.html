<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="description" content="I Matter is a Positive Youth Development toolkit for teachers, facilitators, and youth workers to guide adolescents through life skills. A program by Imagine Tomorrow Foundation.">

  <main id="main" class="app-main" role="main" tabindex="-1"></main>

  <!-- App footer -->
  <footer class="app-footer" role="contentinfo">
    <p id="footer-text">I Matter is a program by Imagine Tomorrow Foundation.</p>
  </footer>

  <!-- Bottom navigation -->
  <nav class="bottom-nav" role="navigation" aria-label="Main navigation" id="bottom-nav"></nav>

  <!-- Toast area for announcements (offline, updates, badges) -->
